# nginx examples for the ShibaCoin Block Visualizer.
# The visualizer listens on 127.0.0.1:3002 (PORT/HOST env vars).
# The page uses relative URLs (api/state), so it works at a domain root or
# under any sub-path, as long as the sub-path ends with a slash.

# ---------------------------------------------------------------------------
# Option A: its own (sub)domain, e.g. https://blocks.example.org/
# Get a certificate afterwards with:  sudo certbot --nginx -d blocks.example.org
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name blocks.example.org;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------
# Option B: a sub-path of an existing site, e.g. https://example.org/blocks/
# Paste these two blocks INSIDE your existing server { } block, ABOVE any
# catch-all `location /` (e.g. one that proxies to a Next.js/Node app).
# ---------------------------------------------------------------------------
#
#   # /blocks -> /blocks/ (without the slash, the page's relative API URLs break)
#   location = /blocks { return 301 /blocks/; }
#
#   location /blocks/ {
#       proxy_pass http://127.0.0.1:3002/;   # trailing slash strips the /blocks prefix
#       proxy_http_version 1.1;
#       proxy_set_header Host              $host;
#       proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#       proxy_set_header X-Forwarded-Proto $scheme;
#   }
